version: '3.8'

services:
  db-postgres:
    image: postgres:15-alpine
    container_name: citas-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app-citas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citas-app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db-postgres

volumes:
  pgdata:
